<!DOCTYPE html>
<html>
<head>

<meta name="monetag" content="a35a4f928207fe433db55a28e9803644">

<meta charset="UTF-8">
<title>TKMC Crush Confession Board 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

/* ===== HEADER ===== */
h1{
    text-align:center;
    margin:15px 0;
}

/* ===== LAYOUT ===== */
.wrapper{
    display:flex;
    gap:20px;
    padding:20px;
}

@media(max-width:800px){
    .wrapper{flex-direction:column;}
}

/* ===== FORM ===== */
.formBox{
    flex:1;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    padding:20px;
    border-radius:16px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    font-size:14px;
}

textarea{
    height:120px;
}

button{
    width:100%;
    padding:12px;
    background:#ff4d6d;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* ===== BOARD ===== */
.board{
    flex:2;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    padding:15px;
    border-radius:16px;
    overflow:auto;
    max-height:80vh;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#ff4d6d;
    padding:10px;
    text-align:left;
}

td{
    padding:8px;
    border-bottom:1px solid rgba(255,255,255,0.25);
}

tr:hover{
    background:rgba(255,255,255,0.08);
}

.time{
    font-size:12px;
    opacity:.8;
}
</style>
</head>


<body>

<h1>💌 Anonymous Crush Board</h1>

<div class="wrapper">

    <!-- ================= FORM ================= -->
    <div class="formBox">
        <h3>Send Message ❤️</h3>

        <input id="name" placeholder="Crush name">
        <textarea id="msg" placeholder="Message to your crush"></textarea>

        <button onclick="send()">Submit</button>
    </div>


    <!-- ================= TABLE ================= -->
    <div class="board">
        <h3>❤️ Live Messages</h3>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Message</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

</div>


<script>

/* ================= SETTINGS ================= */
const COOLDOWN = 120; // seconds

const FORM_ACTION =
"https://docs.google.com/forms/d/e/1FAIpQLSfelU_00WKalp-lEBfJgMz7KvGEdjh8CMoI3XhfCAbjD2thUw/formResponse";

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRp0XnZWfv7TKjF6eH5NNdtjGkn_U0qx9QfwT_9iUW_g9xmf02hg0opDrrJeZb3PJNdsTs7Ub2-6BcK/pub?output=csv";


/* ================= BUTTON ================= */
const btn = document.querySelector("button");


/* ================= COOLDOWN TIMER ================= */

function startTimer(seconds){

    const end = Date.now() + seconds*1000;
    localStorage.setItem("cooldownEnd", end);

    updateTimer();
}

function updateTimer(){

    const end = localStorage.getItem("cooldownEnd");

    if(!end){
        btn.disabled = false;
        btn.innerText = "Submit";
        return;
    }

    const left = Math.ceil((end - Date.now())/1000);

    if(left <= 0){
        localStorage.removeItem("cooldownEnd");
        btn.disabled = false;
        btn.innerText = "Submit";
        return;
    }

    btn.disabled = true;
    btn.innerText = `Wait ${left}s`;

    setTimeout(updateTimer, 500);
}


/* ================= SUBMIT ================= */

function send(){

    // block if timer active
    if(localStorage.getItem("cooldownEnd")){
        alert("Please wait for timer ⏳");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const msg  = document.getElementById("msg").value.trim();

    if(!name || !msg){
        alert("Fill both fields");
        return;
    }

    const fd = new FormData();
    fd.append("entry.114558379", name);
    fd.append("entry.629672075", msg);

    fetch(FORM_ACTION,{
        method:"POST",
        mode:"no-cors",
        body:fd
    });

    alert("Sent anonymously 💌");

    document.getElementById("name").value="";
    document.getElementById("msg").value="";

    startTimer(COOLDOWN); // ⭐ start 15s cooldown
    setTimeout(loadData,1500);
}


/* ================= LOAD TABLE (unchanged) ================= */

let lastHTML="";

async function loadData(){

    try{
        const res = await fetch(CSV_URL);
        const text = await res.text();

        const rows = text.split("\n").slice(1).reverse();

        let html="";
        let i=1;

        rows.forEach(r=>{
            if(!r) return;

            const c=r.split(",");
            const time=c[0], name=c[1], msg=c[2];

            if(!name || !msg) return;

            html += `
            <tr>
                <td>${i++}</td>
                <td>${name}</td>
                <td>${msg}</td>
                <td class="time">${time}</td>
            </tr>`;
        });

        if(html){
            lastHTML=html;
            document.getElementById("rows").innerHTML=html;
        }

    }catch{
        document.getElementById("rows").innerHTML=lastHTML;
    }
}

loadData();
setInterval(loadData,10000);


/* ================= RUN ON PAGE LOAD ================= */
startTimer(COOLDOWN); // ⭐ 15s timer every refresh

</script>

</body>
</html>
