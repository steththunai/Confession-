<!DOCTYPE html>
<html lang="en">
<head>




<meta charset="UTF-8">
<title>TKMC Crush Confession Board 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

/* HEADER */
h1{
    text-align:center;
    margin:15px 0;
}

/* LAYOUT */
.wrapper{
    display:flex;
    gap:20px;
    padding:20px;
}
@media(max-width:800px){
    .wrapper{flex-direction:column;}
}

/* FORM */
.formBox{
    flex:1;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    padding:20px;
    border-radius:16px;
}
input, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    font-size:14px;
}
textarea{height:120px;}
button{
    width:100%;
    padding:12px;
    background:#ff4d6d;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* BOARD */
.board{
    flex:2;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    padding:15px;
    border-radius:16px;
    max-height:80vh;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}
th{
    background:#ff4d6d;
    padding:10px;
    position:sticky;
    top:0;
}
td{
    padding:8px;
    border-bottom:1px solid rgba(255,255,255,0.25);
}

/* NEW MESSAGE */
.new{
    background:rgba(255,255,255,0.25);
    animation:fadeIn 0.6s ease;
}
.badge{
    background:#ffcc00;
    color:black;
    font-size:10px;
    padding:2px 6px;
    border-radius:6px;
    margin-left:6px;
}

.time{font-size:12px;opacity:.8;}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(5px);}
    to{opacity:1;transform:none;}
}

/* PAGINATION */
.pagination{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}
.pagination button{
    width:auto;
    padding:6px 12px;
    font-size:14px;
}
</style>
</head>

<body>

<h1>💌 Anonymous Crush Board</h1>

<div class="wrapper">

<!-- FORM -->
<div class="formBox">
<h3>Send Message ❤️</h3>
<input id="name" placeholder="Crush name">
<textarea id="msg" placeholder="Message to your crush"></textarea>
<button onclick="send()">Submit</button>
</div>

<!-- BOARD -->
<div class="board">
<h3>❤️ Live Messages</h3>

<table>
<thead>
<tr>
<th>#</th>
<th>Name</th>
<th>Message</th>
<th>Time</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<div class="pagination">
<button onclick="prevPage()">⬅ Prev</button>
<button onclick="nextPage()">Next ➡</button>
</div>
</div>

</div>

<script>


/* ===== BLOCK NUMBERS ===== */

function blockNumbers(el){
    el.addEventListener("input", function(){
        this.value = this.value.replace(/[0-9]/g, "");
    });
}

/* apply to both fields */
blockNumbers(document.getElementById("name"));
blockNumbers(document.getElementById("msg"));

/* ================= SETTINGS ================= */

const COOLDOWN = 0; // seconds

const FORM_ACTION =
"https://docs.google.com/forms/d/e/1FAIpQLSfelU_00WKalp-lEBfJgMz7KvGEdjh8CMoI3XhfCAbjD2thUw/formResponse";

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRp0XnZWfv7TKjF6eH5NNdtjGkn_U0qx9QfwT_9iUW_g9xmf02hg0opDrrJeZb3PJNdsTs7Ub2-6BcK/pub?output=csv";


/* ================= BLOCK RULES ================= */

/* 🚫 ALL emojis */
const emojiRegex = /\p{Extended_Pictographic}/gu;

/* 🚫 bad words (add more anytime) */
const badWords = [
"fuck","shit","bitch","asshole","porn","punda","sex","sunni" , "oombu"
,"தேவடியா","புண்ட","ஓம்பு","சூது", "entry"
];


/* ================= HELPERS ================= */

function hasBadWord(t){
    t = t.toLowerCase();
    return badWords.some(w => t.includes(w));
}

function onlyNumbers(t){
    return /^[0-9]+$/.test(t);
}

function tooShort(t){
    return t.length < 3;
}

function cleanEmojiLive(el){
    el.value = el.value.replace(emojiRegex,"");
}


/* ================= BLOCK PASTE ================= */

document.addEventListener("paste",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());


/* ================= AUTO REMOVE EMOJI WHILE TYPING ================= */

document.querySelectorAll("input,textarea").forEach(el=>{
    el.addEventListener("input",()=>cleanEmojiLive(el));
});


/* ================= COOLDOWN ================= */

const btn = document.querySelector("button");

function startCooldown(){
    const end = Date.now() + COOLDOWN*1000;
    localStorage.setItem("cooldown", end);
    updateCooldown();
}

function updateCooldown(){

    const end = localStorage.getItem("cooldown");

    if(!end){
        btn.disabled=false;
        btn.innerText="Submit";
        return;
    }

    const left = Math.ceil((end-Date.now())/1000);

    if(left<=0){
        localStorage.removeItem("cooldown");
        btn.disabled=false;
        btn.innerText="Submit";
        return;
    }

    btn.disabled=true;
    btn.innerText=`Wait ${left}s`;

    setTimeout(updateCooldown,500);
}

if(/[0-9]/.test(name) || /[0-9]/.test(msg)){
    alert("Numbers are not allowed ❌");
    return;
}

/* ================= SUBMIT ================= */

let lastMsg = "";

function send(){

    if(localStorage.getItem("cooldown")){
        alert("Please wait ⏳");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const msg  = document.getElementById("msg").value.trim();

    if(!name || !msg){
        alert("Fill both fields");
        return;
    }

    if(emojiRegex.test(name+msg)){
        alert("Emojis not allowed ❌");
        return;
    }

    if(hasBadWord(name) || hasBadWord(msg)){
        alert("Bad words not allowed ❌");
        return;
    }

    if(tooShort(name) || tooShort(msg)){
        alert("Too short ❌");
        return;
    }

    if(onlyNumbers(name) || onlyNumbers(msg)){
        alert("Numbers only not allowed ❌");
        return;
    }

    if(msg === lastMsg){
        alert("Duplicate message ❌");
        return;
    }

    lastMsg = msg;

    const fd = new FormData();
    fd.append("entry.114558379", name);
    fd.append("entry.629672075", msg);

    fetch(FORM_ACTION,{
        method:"POST",
        mode:"no-cors",
        body:fd
    });

    alert("Sent 💌");

    document.getElementById("name").value="";
    document.getElementById("msg").value="";

    startCooldown();
    setTimeout(loadData,1500);
}


/* ================= TABLE ================= */

let allRows=[];
let page=0;
const perPage=10;

async function loadData(){

    const res = await fetch(CSV_URL);
    const text = await res.text();

    const raw = text.split("\n").slice(1).filter(r=>r);

    allRows = raw.reverse();
    render();
}

function render(){

    const start = page*perPage;
    const slice = allRows.slice(start,start+perPage);

    let html="";
    let num=allRows.length-start;

    slice.forEach((r,i)=>{

        const c=r.split(",");

        if(!c[1]||!c[2]) return;

        html+=`
        <tr class="${page===0&&i===0?'new':''}">
            <td>${num--}</td>
            <td>${c[1]} ${page===0&&i===0?'<span class="badge">NEW</span>':''}</td>
            <td>${c[2]}</td>
            <td class="time">${c[0]}</td>
        </tr>`;
    });

    document.getElementById("rows").innerHTML=html;
}

function nextPage(){ if((page+1)*perPage<allRows.length){page++;render();}}
function prevPage(){ if(page>0){page--;render();}}


/* ================= INIT ================= */

startCooldown(); // cooldown on refresh
loadData();
setInterval(loadData,10000);

</script>

</body>
</html>
