
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TKMC Crush Confessions 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    margin:0;
    padding:20px;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

/* ===== HEADER ===== */
h1{
    text-align:center;
    margin-bottom:25px;
}

/* ===== FORM ===== */
.formBox{
    max-width:500px;
    margin:auto;
    background:rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding:20px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
}

input, textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    font-size:15px;
}

textarea{
    height:120px;
}

button{
    width:100%;
    padding:12px;
    background:#ff4d6d;
    color:white;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff3355;
}

/* ===== MESSAGE LIST ===== */
.list{
    max-width:600px;
    margin:35px auto;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius:16px;
    padding:15px;
    margin-bottom:15px;
    animation:fade .4s ease;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
}

.card b{
    font-size:16px;
}

.time{
    font-size:12px;
    opacity:.8;
    margin-top:6px;
}

@keyframes fade{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1;}
}
</style>
</head>

<body>

<h1>💌 Anonymous Crush Messages</h1>

<!-- ===== FORM ===== -->
<div class="formBox">

<input id="name" placeholder="Crush name ❤️">
<textarea id="msg" placeholder="Message to your crush 💬"></textarea>

<button onclick="send()">Send Confession</button>

</div>


<h2 style="text-align:center;margin-top:35px;">❤️ Messages</h2>
<div id="responses" class="list"></div>


<script>

/* ===== LINKS ===== */
const FORM_ACTION =
"https://docs.google.com/forms/d/e/1FAIpQLSfelU_00WKalp-lEBfJgMz7KvGEdjh8CMoI3XhfCAbjD2thUw/formResponse";

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRp0XnZWfv7TKjF6eH5NNdtjGkn_U0qx9QfwT_9iUW_g9xmf02hg0opDrrJeZb3PJNdsTs7Ub2-6BcK/pub?output=csv";


/* ===== SEND ===== */
function send(){

    const name = document.getElementById("name").value.trim();
    const msg  = document.getElementById("msg").value.trim();

    if(!name || !msg){
        alert("Fill both fields");
        return;
    }

    const data = new FormData();
    data.append("entry.114558379", name);
    data.append("entry.629672075", msg);

    fetch(FORM_ACTION,{ method:"POST", mode:"no-cors", body:data });

    alert("Sent anonymously 💌");

    document.getElementById("name").value="";
    document.getElementById("msg").value="";

    setTimeout(loadData,2000);
}


/* ===== LOAD MESSAGES ===== */
async function loadData(){

    const res = await fetch(CSV_URL);
    const text = await res.text();

    const rows = text.split("\n").slice(1).reverse();

    let html="";
    let count=1;

    rows.forEach(row=>{

        if(!row) return;

        const c = row.split(",");

        const time = c[0];
        const name = c[1];
        const msg  = c[2];

        /* skip empty rows */
        if(!name || !msg || name==="undefined") return;

        html += `
        <div class="card">
            <b>#${count++} ❤️ ${name}</b>
            <div>💬 ${msg}</div>
            <div class="time">⏰ ${time}</div>
        </div>`;
    });

    document.getElementById("responses").innerHTML = html;
}


/* auto refresh */
loadData();
setInterval(loadData,5000);

</script>

</body>
</html>
