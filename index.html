<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TKMC Confessions • Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ===== BODY ===== */
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
  color:white;
  overflow:hidden;

  background:linear-gradient(-45deg,#667eea,#764ba2,#5f2c82,#49a09d);
  background-size:400% 400%;
  animation:gradient 10s ease infinite;
}

@keyframes gradient{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ===== CARD ===== */
.card{
  text-align:center;
  padding:40px;
  border-radius:20px;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,0.12);
  box-shadow:0 0 40px rgba(0,0,0,0.3);
  width:90%;
  max-width:380px;
}

/* ===== TITLE ===== */
h2{
  margin-bottom:15px;
}

/* ===== TYPING TEXT ===== */
.typing{
  white-space:nowrap;
  overflow:hidden;
  border-right:3px solid white;
  width:0;
  margin:auto;
  font-size:16px;
  animation:typing 4s steps(40,end) forwards, blink 1s infinite;
}

@keyframes typing{
  from{width:0}
  to{width:100%}
}

@keyframes blink{
  50%{border-color:transparent}
}

/* ===== SPINNER ===== */
.spinner{
  margin:25px auto;
  width:45px;
  height:45px;
  border:5px solid rgba(255,255,255,0.3);
  border-top:5px solid white;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ===== COUNTDOWN ===== */
#countdown{
  font-size:26px;
  font-weight:bold;
  margin:10px 0;
}

/* ===== BUTTON ===== */
button{
  margin-top:15px;
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:white;
  color:#5f2c82;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="card">

  <h2>🚧 TKMC Confessions</h2>

  <div class="typing">
    Will be back soon... under construction of site
  </div>

  <div class="spinner"></div>

  <div id="countdown">Loading...</div>

  <button onclick="notify()">🔔 Notify Me</button>

</div>


<script>
/* ===== COUNTDOWN TIMER ===== */
/* Change reopening time here */
const targetDate = new Date();
targetDate.setMinutes(targetDate.getMinutes() + 30); // change minutes if needed

function updateCountdown(){
  const now = new Date();
  const diff = targetDate - now;

  if(diff <= 0){
    document.getElementById("countdown").innerHTML = "✅ We're Live!";
    return;
  }

  const h = Math.floor(diff/1000/60/60);
  const m = Math.floor(diff/1000/60%60);
  const s = Math.floor(diff/1000%60);

  document.getElementById("countdown").innerHTML =
    `${h}h ${m}m ${s}s`;
}

setInterval(updateCountdown,1000);
updateCountdown();


/* ===== NOTIFY BUTTON (NO REDIRECT) ===== */
function notify(){
  alert("🔔 Notification saved!\nWe’ll be back soon 🙂");
}
</script>

</body>
</html>
