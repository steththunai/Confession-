```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TKMC Crush Confessions 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg,#667eea,#764ba2);
    text-align:center;
    color:white;
}

h1{
    margin-top:20px;
}

.box{
    background:white;
    color:black;
    margin:20px;
    padding:20px;
    border-radius:15px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#667eea;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.card{
    background:#ffffff20;
    margin:10px;
    padding:12px;
    border-radius:12px;
}
</style>
</head>

<body>

<h1>💌 Anonymous Crush Messages</h1>

<!-- ================= FORM ================= -->
<div class="box">

<input id="name" placeholder="Crush name ❤️">
<textarea id="msg" placeholder="Message to your crush 💬"></textarea>

<button onclick="send()">Submit</button>

</div>


<h2>❤️ Messages</h2>
<div id="responses"></div>


<script>

/* ================= GOOGLE FORM SETTINGS ================= */

const FORM_ACTION =
"https://docs.google.com/forms/d/e/1FAIpQLSfelU_00WKalp-lEBfJgMz7KvGEdjh8CMoI3XhfCAbjD2thUw/formResponse";

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRp0XnZWfv7TKjF6eH5NNdtjGkn_U0qx9QfwT_9iUW_g9xmf02hg0opDrrJeZb3PJNdsTs7Ub2-6BcK/pub?output=csv";


/* ================= SUBMIT ================= */

function send(){

    const name = document.getElementById("name").value.trim();
    const msg  = document.getElementById("msg").value.trim();

    if(!name || !msg){
        alert("Fill both fields");
        return;
    }

    const formData = new FormData();

    /* YOUR ENTRY IDS */
    formData.append("entry.114558379", name);
    formData.append("entry.629672075", msg);

    fetch(FORM_ACTION,{
        method:"POST",
        mode:"no-cors",
        body:formData
    });

    alert("Sent anonymously ✅");

    document.getElementById("name").value="";
    document.getElementById("msg").value="";

    setTimeout(loadData,2000);
}


/* ================= SHOW RESPONSES ================= */

async function loadData(){

    const res = await fetch(CSV_URL);
    const text = await res.text();

    const rows = text.split("\n").slice(1).reverse();

    let html="";

    rows.forEach((row,i)=>{
        if(!row) return;

        const cols = row.split(",");

        const time = cols[0];
        const name = cols[1];
        const msg  = cols[2];

        html += `
        <div class="card">
            <b>#${i+1}</b><br>
            ❤️ <b>${name}</b><br>
            💬 ${msg}<br>
            ⏰ ${time}
        </div>`;
    });

    document.getElementById("responses").innerHTML = html;
}


/* auto refresh every 5 sec */
loadData();
setInterval(loadData,5000);


/* block copy paste */
document.addEventListener("paste",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());

</script>

</body>
</html>
