<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TKMC Confessions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    text-align:center;
    color:white;
}

h1{
    margin-top:25px;
}

.box{
    margin:20px;
    background:white;
    padding:20px;
    border-radius:15px;
}

textarea{
    width:100%;
    height:150px;
    padding:10px;
    font-size:16px;
}

button{
    margin-top:15px;
    width:100%;
    padding:12px;
    font-size:18px;
    background:#667eea;
    color:white;
    border:none;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>💌 Anonymous Confession</h1>

<div class="box">

<textarea id="msg" placeholder="Type your confession here..."></textarea>

<button onclick="send()">Submit</button>

</div>

<script>
const API = "https://confession-api-thlm.onrender.com/send"; // ← your Render URL

function send(){
    const text = document.getElementById("msg").value.trim();

    if(text.length < 2){
        alert("Type something");
        return;
    }

    fetch(API,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:text})
    });

    alert("Submitted anonymously ✅");
    document.getElementById("msg").value="";
}

/* block copy paste */
document.addEventListener("paste", e => e.preventDefault());
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());

/* block right click */
document.addEventListener("contextmenu", e => e.preventDefault());
</script>

</body>
</html>
